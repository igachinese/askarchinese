<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Аскар FC: Профессии и Звёзды футбола | 阿斯凯 FC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky club header; home = season plan (4 lessons → modules); each module is one focused screen. The sticker album is the spine of the site. */
:root{
  --bg:#eef4ee;
  --page:#ffffff;
  --ink:#152a24;
  --muted:#5a6f68;
  --line:#cfe0d6;
  --club:#123d2e;
  --club-2:#1c5a43;
  --grass:#3c8e4c;
  --grass-2:#47a058;
  --gold:#e8b21f;
  --gold-soft:#fff3cc;
  --red:#e0483a;
  --red-d:#a92d22;
  --teal:#17807e;
  --ok:#2f9e5b;
  --ok-soft:#ddf3e5;
  --bad:#d6403f;
  --bad-soft:#fde5e3;
  --f-body:"Trebuchet MS","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-zh:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--club)}
.zh{font-family:var(--f-zh);font-weight:700}
.py{font-weight:700;color:var(--teal);font-size:.8em}
body.nopy .py{display:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--club);color:#fff;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 4px 16px rgba(5,30,20,.3)}
.badge{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;padding:0;text-align:left}
.badge svg{width:40px;height:40px;flex:none}
.badge b{display:block;font-weight:900;font-size:1.05rem;line-height:1.1}
.badge small{display:block;opacity:.75;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.hstat{display:flex;gap:10px;margin-left:auto;font-weight:900;align-items:center}
.hstat span{background:rgba(255,255,255,.12);border-radius:10px;padding:4px 10px;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tbtn{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:6px 10px;font-weight:800;font-size:.82rem;white-space:nowrap}
.tbtn[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.warn{background:var(--gold-soft);color:#6b4b00;font-weight:700;font-size:.88rem;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid #f0d58a}

main{max-width:980px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{animation:in .3s ease both}
@keyframes in{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
h1.t{margin:0 0 4px;font-size:clamp(1.4rem,4.4vw,2rem);font-weight:900;text-wrap:balance}
h1.t .zh{color:var(--red);margin-right:8px}
.sub{color:var(--muted);font-weight:700;margin:0 0 14px}
.back{background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800;color:var(--muted)}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--red);color:#fff;border:0;border-radius:14px;padding:13px 24px;font-weight:900;font-size:1.1rem;box-shadow:0 6px 0 var(--red-d);transition:transform .1s,box-shadow .1s}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 var(--red-d)}
.cta.green{background:var(--club-2);box-shadow:0 6px 0 var(--club)}
.cta.green:active{box-shadow:0 2px 0 var(--club)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* home */
.hero{background:linear-gradient(135deg,var(--club) 0%,var(--club-2) 100%);color:#fff;border-radius:22px;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;overflow:hidden;position:relative}
.hero h1{margin:0;font-size:clamp(1.6rem,5vw,2.4rem);font-weight:900;text-wrap:balance}
.hero h1 .zh{display:block;color:var(--gold);font-size:.7em;letter-spacing:.12em}
.hero p{margin:8px 0 0;opacity:.9;font-weight:700;max-width:52ch}
.hero .ball{font-size:5rem;line-height:1}
.lessons{display:grid;gap:14px;margin-top:18px;grid-template-columns:repeat(2,minmax(0,1fr))}
.lesson{background:var(--page);border-radius:18px;padding:14px;box-shadow:0 6px 18px rgba(20,60,40,.08);min-width:0}
.lesson h2{margin:0 0 2px;font-size:1.1rem;font-weight:900;display:flex;gap:8px;align-items:center}
.lesson h2 .n{background:var(--club);color:var(--gold);border-radius:8px;padding:2px 8px;font-size:.8rem;letter-spacing:.06em}
.lesson p{margin:0 0 10px;color:var(--muted);font-weight:700;font-size:.9rem}
.mods{display:grid;gap:8px}
.mod{display:flex;align-items:center;gap:12px;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.mod:hover{border-color:var(--grass)}
.mod .ic{font-size:1.8rem;flex:none;width:44px;text-align:center}
.mod b{display:block;font-size:1rem}
.mod span{display:block;color:var(--muted);font-size:.84rem;font-weight:700}
.mod .sc{margin-left:auto;font-weight:900;color:var(--club-2);white-space:nowrap;font-variant-numeric:tabular-nums}

/* word cards */
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.wcard{background:var(--page);border:3px solid var(--line);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;position:relative;min-width:0}
.wcard:hover{border-color:var(--grass)}
.wcard .emo{font-size:2.6rem;line-height:1.1}
.wcard .zh{font-size:1.5rem}
.wcard .ru{color:var(--muted);font-weight:700;font-size:.88rem}
.wcard .tb{position:absolute;top:6px;right:8px;font-size:.62rem;font-weight:900;letter-spacing:.05em;color:#fff;background:var(--teal);border-radius:5px;padding:1px 5px}
.wcard .tb.ex{background:var(--gold);color:var(--ink)}
.wcard.flip .ru{display:none}
.grammar{margin-top:18px;background:var(--page);border-radius:18px;padding:14px 16px;border-left:6px solid var(--gold)}
.grammar h3{margin:0 0 8px;font-size:1rem}
.gl{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.gl:last-child{border-bottom:0}
.gl .zh{font-size:1.25rem}
.gl .ru{color:var(--muted);font-weight:700;font-size:.9rem}
.sbtn{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--gold);font-size:1.1rem;box-shadow:0 3px 0 #b88a0e}
.sbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #b88a0e}

/* quiz */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qhead h1{margin:0;font-size:clamp(1.2rem,3.6vw,1.6rem);font-weight:900}
.dots{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.dot{width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.dot.ok{background:var(--ok);border-color:var(--ok)}.dot.miss{background:var(--gold);border-color:var(--gold)}.dot.cur{border-color:var(--club);transform:scale(1.25)}
.score{display:flex;gap:8px;align-items:center;margin-left:auto;font-weight:900;font-size:1.2rem;font-variant-numeric:tabular-nums}
.score span{background:var(--club);color:#fff;border-radius:10px;padding:3px 10px}
.prompt{background:var(--page);border-radius:20px;padding:14px 16px;box-shadow:0 8px 22px rgba(20,60,40,.1)}
.prompt .ask{font-weight:900;color:var(--muted);font-size:.95rem}
.prompt .scene{font-size:clamp(2.6rem,11vw,4rem);text-align:center;line-height:1.2;margin:6px 0}
.qline{display:flex;align-items:center;gap:12px;margin-top:6px}
.qline .face{font-size:2.4rem;flex:none;line-height:1}
.qline .q{flex:1;min-width:0;font-size:clamp(1.3rem,4.6vw,1.9rem);line-height:1.25}
.qline .q.hid{color:transparent;background:repeating-linear-gradient(90deg,var(--line) 0 16px,transparent 16px 24px);height:.9em;border-radius:6px;max-width:320px}
.listen{flex:none;width:62px;height:62px;border-radius:50%;border:0;background:var(--gold);font-size:1.7rem;box-shadow:0 4px 0 #b88a0e;display:grid;place-items:center}
.listen:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a0e}
.listen.pulse{animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 4px 0 #b88a0e,0 0 0 0 rgba(232,178,31,.6)}70%{box-shadow:0 4px 0 #b88a0e,0 0 0 16px rgba(232,178,31,0)}100%{box-shadow:0 4px 0 #b88a0e,0 0 0 0 rgba(232,178,31,0)}}
.hint{margin-top:8px;color:var(--muted);font-weight:800;font-size:.9rem}
.opts{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px}
@media(min-width:760px){.opts.four{grid-template-columns:repeat(4,minmax(0,1fr))}}
.opt{background:var(--page);border:3px solid var(--line);border-radius:16px;padding:12px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-width:0;transition:transform .12s,border-color .2s,background .2s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--teal)}
.opt .emo{font-size:2.6rem;line-height:1.1}
.opt .zh{font-size:clamp(1.15rem,4vw,1.5rem);line-height:1.25}
.opt .rev{display:none}
.opts.done .opt .rev{display:block}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.opts.done .opt:not(.ok){opacity:.5}
.opt:disabled{cursor:default}
.opt svg.jersey{width:84px;height:84px}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.after{margin-top:14px;background:var(--club);color:#fff;border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.after .say{flex:1;min-width:200px}
.after small{display:block;font-weight:800;opacity:.85}
.after .zh{display:block;font-size:clamp(1.4rem,5vw,2rem);color:#ffe28a;line-height:1.25}
.after .py{color:#bfeadb;font-size:.95rem}
.after .ru{display:block;opacity:.9;font-weight:700}
.after .mini{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:14px}

/* penalty strip */
.pitch{position:relative;height:130px;border-radius:16px;overflow:hidden;margin-top:12px;background:repeating-linear-gradient(90deg,var(--grass) 0 44px,var(--grass-2) 44px 88px)}
.goal{position:absolute;left:50%;top:8px;width:min(230px,70%);height:76px;transform:translateX(-50%);border:5px solid #fff;border-bottom:0;border-radius:6px 6px 0 0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 2px,transparent 2px 10px),repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 2px,transparent 2px 10px),rgba(10,40,25,.25)}
.keeper{position:absolute;left:50%;bottom:44px;margin-left:-20px;font-size:2.5rem;line-height:1;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.pball{position:absolute;left:50%;bottom:6px;margin-left:-16px;font-size:2rem;line-height:1;transition:transform .5s cubic-bezier(.2,.8,.3,1)}
.pbig{position:absolute;left:12px;bottom:8px;max-width:46%;color:#fff;font-weight:900;font-size:1.15rem;text-shadow:0 2px 6px rgba(0,0,0,.45);opacity:0;transition:opacity .25s}
.pbig.on{opacity:1}

/* album */
.album{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.slot{position:relative;border-radius:18px;padding:10px;background:var(--page);border:3px dashed var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:210px;min-width:0}
.slot .num{position:absolute;top:8px;left:10px;font-weight:900;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.slot .flag{position:absolute;top:8px;right:8px;width:34px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.slot svg.jersey{width:110px;height:110px;margin-top:10px}
.slot .nm{font-size:1.25rem}
.slot .ru{font-weight:800;color:var(--muted);font-size:.85rem}
.slot.empty svg.jersey{filter:grayscale(1) opacity(.35)}
.slot.empty .nm{color:#9fb3aa}
.slot.glued{border:3px solid var(--gold);background:linear-gradient(160deg,#fffdf3 0%,#fff 55%,#fff6d6 100%);box-shadow:0 8px 20px rgba(160,120,10,.18)}
.slot.glued::after{content:"";position:absolute;inset:0;border-radius:15px;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.65) 45%,transparent 60%);background-size:250% 100%;animation:shine 3.5s infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.slot .tag{font-size:.75rem;font-weight:900;color:var(--club-2);background:var(--ok-soft);border-radius:8px;padding:2px 8px}
.slot.empty .tag{background:var(--gold-soft);color:#6b4b00}
.progress{height:12px;background:var(--page);border-radius:8px;overflow:hidden;margin:4px 0 16px;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--grass))}

/* dossier */
.dos{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.dos .pic{background:var(--page);border-radius:20px;padding:12px;text-align:center;box-shadow:0 8px 22px rgba(20,60,40,.1)}
.dos .pic svg.jersey{width:170px;height:170px}
.dos .pic .flag{width:60px;border-radius:5px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.dos .pic .nm{font-size:1.6rem;display:block}
.lines{background:var(--page);border-radius:20px;padding:10px 14px;box-shadow:0 8px 22px rgba(20,60,40,.1)}
.ln{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ln:last-child{border-bottom:0}
.ln .vis{font-size:1.9rem;flex:none;width:96px;text-align:center;line-height:1.1}
.ln .txt{flex:1;min-width:0}
.ln .txt .zh{font-size:1.3rem}
body.hidetxt .ln .txt .zh,body.hidetxt .ln .txt .py{filter:blur(7px)}
.fact{margin-top:12px;background:var(--gold-soft);border-radius:14px;padding:10px 14px;font-weight:700}

/* interview */
.iv{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.qrow{background:var(--page);border-radius:16px;padding:10px 12px;margin-bottom:10px;border:2px solid transparent}
.qrow.need{border-color:var(--gold)}
.qrow .qq{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.qrow .qq .zh{font-size:1.1rem}
.qrow .qq .new{background:var(--red);color:#fff;font-size:.62rem;font-weight:900;padding:1px 6px;border-radius:5px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:5px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.chip .zh{font-size:1.05rem}
.chip .e{font-size:1.2rem}
.chip.on{border-color:var(--ok);background:var(--ok-soft)}
.mic{position:sticky;top:76px;background:var(--club);color:#fff;border-radius:20px;padding:16px}
.mic h3{margin:0 0 8px;display:flex;gap:8px;align-items:center}
.mic .l{padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.2)}
.mic .l .zh{font-size:1.15rem;color:#ffe28a}
.mic .l .py{color:#bfeadb;display:block}
.mic .l.empty{opacity:.45}

/* end */
.final{background:var(--page);border-radius:22px;padding:22px;text-align:center;box-shadow:0 10px 30px rgba(20,60,40,.12)}
.final .cup{font-size:4rem;line-height:1}
.final h1{margin:6px 0;font-size:clamp(1.5rem,5vw,2.2rem);font-weight:900;text-wrap:balance}
.final .big{font-size:2.6rem;font-weight:900;font-variant-numeric:tabular-nums}
.teacher{margin-top:16px;background:var(--bg);border-radius:14px;padding:12px 16px;text-align:left}
.teacher h3{margin:0 0 6px;font-size:1rem}
.teacher ul{margin:0;padding-left:20px;display:grid;gap:4px}
.teacher li small{display:block;color:var(--muted);font-weight:700}
.ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,30,20,.6);padding:20px}
.stick{background:var(--page);border-radius:24px;padding:22px;text-align:center;max-width:360px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
.stick svg.jersey{width:150px;height:150px}
.stick h2{margin:6px 0 2px;font-size:1.5rem}

@media(max-width:760px){.lessons{grid-template-columns:1fr}.dos,.iv{grid-template-columns:1fr}.mic{position:static}.hero{grid-template-columns:1fr}.hero .ball{display:none}}
@media(max-width:480px){.badge small{display:none}.ln .vis{width:64px;font-size:1.5rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top">
  <button class="badge" id="home" aria-label="На главную">
    <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4 L90 16 L86 60 Q80 84 50 96 Q20 84 14 60 L10 16 Z" fill="#e8b21f" stroke="#fff" stroke-width="4"/><path d="M50 14 L80 23 L77 58 Q72 76 50 86 Q28 76 23 58 L20 23 Z" fill="#123d2e"/><circle cx="50" cy="50" r="17" fill="#fff"/><path d="M50 38 L58 44 L55 54 L45 54 L42 44 Z" fill="#123d2e"/><text x="50" y="80" text-anchor="middle" font-size="11" font-weight="900" fill="#e8b21f" font-family="sans-serif">FC</text></svg>
    <span><b><span class="zh">阿斯凯</span> FC</b><small>Профессии · семьи звёзд</small></span>
  </button>
  <div class="hstat"><span id="hStars" title="Звёзды за правильные ответы">⭐ 0</span><span id="hStick" title="Наклейки в альбоме">🃏 0/12</span></div>
  <div class="tools"><a href="index.html" class="tbtn" style="text-decoration:none; display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.25); border:1.5px solid rgba(255,255,255,0.5); color:#fff; font-weight:800; padding:6px 14px; border-radius:10px; box-shadow:0 2px 0 rgba(0,0,0,0.2);">← В дашборд</a>
    <button class="tbtn" id="tPy" aria-pressed="true">pīnyīn</button>
    <button class="tbtn" id="tKid" aria-pressed="true">🧒 голос</button>
    <button class="tbtn" id="tVoice" title="Сменить голос">🔁</button>
    <button class="tbtn" id="tSlow" aria-pressed="false">🐢 慢</button>
  </div>
</header>
<div class="warn" id="warn" hidden></div>
<main id="app"></main>
<div id="ov"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const app=$('#app'),ovEl=$('#ov');
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);

          $('#aft').scrollIntoView({behavior:'smooth',block:'nearest'});

      }else{
        btn.classList.add('bad');btn.disabled=true;sBad();

    onDone?onDone({a,p,n:items.length,miss}):result({title,a,p,n:items.length,miss,penalty,again:cfg.again})}};

    after:{zh:`他妈妈也是${PR[s.mom].zh}。`,py:`Tā māma yě shì ${PR[s.mom].py}.`,ru:'也 = тоже'}});
  if(s.sib){

      after:{zh:`他有${t[0]}。`,py:`Tā yǒu ${t[1]}.`}});

    after:{zh:`他家有${KN[s.kou][0]}口人。`,py:`Tā jiā yǒu ${KN[s.kou][1]} kǒu rén.`}});
  if(s.bro)it.push({ask:'Кем стал младший брат?',say:`${s.zh}的弟弟做什么工作？`,sayPy:`${s.py} de dìdi zuò shénme gōngzuò?`,show:true,cls:'four',
    options:[profOpt('yundongyuan',true,true),...distract('yundongyuan',3).map(x=>profOpt(x,false,true))],after:{zh:'他弟弟也是足球运动员。',py:'Tā dìdi yě shì zúqiú yùndòngyuán.'}});
  return it;
}
function sibVariants(sib){
  const key=JSON.stringify(sib);const out=[];const seen=new Set([key]);
  const cands=[{g:1},{j:1},{d:1},{m:1},{g:2},{j:2},{g:1,m:1},{j:1,d:1},{g:2,m:1},{g:1,j:2},{g:1,d:1},{j:1,m:1},{d:1,m:1},{g:1,j:1},{d:2},{m:2}];
  shuffle(cands).forEach(c=>{const k=JSON.stringify(c);if(out.length<3&&!seen.has(k)){seen.add(k);out.push(c)}});
  return out;
}

function clues(s){
  const C=CT[s.c],out=[{t:'c',zh:`他是${C[0]}人。`,py:`Tā shì ${C[1]} rén.`,m:x=>x.c===s.c}];
  const st=sibText(s);
  if(s.sib)out.push({t:'s',zh:`他有${st[0]}。`,py:`Tā yǒu ${st[1]}.`,m:x=>JSON.stringify(x.sib)===JSON.stringify(s.sib)});
  if(s.dad)out.push({t:'d',zh:`他爸爸是${PR[s.dad].zh}。`,py:`Tā bàba shì ${PR[s.dad].py}.`,m:x=>x.dad===s.dad});
  if(s.mom)out.push({t:'m',zh:`他妈妈是${PR[s.mom].zh}。`,py:`Tā māma shì ${PR[s.mom].py}.`,m:x=>x.mom===s.mom});
  if(s.kou)out.push({t:'k',zh:`他家有${KN[s.kou][0]}口人。`,py:`Tā jiā yǒu ${KN[s.kou][1]} kǒu rén.`,m:x=>x.kou===s.kou});
  if(s.bro)out.push({t:'b',zh:'他弟弟也是足球运动员。',py:'Tā dìdi yě shì zúqiú yùndòngyuán.',m:x=>!!x.bro});
  return out;
}
function guessItems(n){
  return pick(STARS,n).map(s=>{
    const all=clues(s);let use=[all[0],...shuffle(all.slice(1)).slice(0,2)];
    const others=STARS.filter(x=>x!==s);
    let matching=others.filter(x=>use.every(c=>c.m(x)));
    const rest=shuffle(all.filter(c=>!use.includes(c)));
    while(matching.length&&rest.length){use.push(rest.shift());matching=others.filter(x=>use.every(c=>c.m(x)))}
    const wrong=pick(others.filter(x=>!use.every(c=>c.m(x))),3);
    return {ask:'Угадай звезду по подсказкам!',say:use.map(c=>c.zh).join(''),sayPy:use.map(c=>c.py).join(' '),show:false,cls:'four',
      options:[starOpt(s,true),...wrong.map(x=>starOpt(x,false))],after:{zh:`他是${s.zh}！`,py:`Tā shì ${s.py}!`,ru:s.ru}};
  });
}

 {id:'sib',q:['你有兄弟姐妹吗？','Nǐ yǒu xiōngdì jiěmèi ma?'],opts:[['g','哥哥','gēge'],['j','姐姐','jiějie'],['d','弟弟','dìdi'],['m','妹妹','mèimei'],['0','没有','méiyǒu']].map(([k,c,cp])=>({k,c,cp}))},
 {id:'kou',q:['你家有几口人？','Nǐ jiā yǒu jǐ kǒu rén?'],opts:[3,4,5,6].map(n=>({k:n,c:KN[n][0]+'口人',cp:KN[n][1]+' kǒu rén'}))},
 {id:'star',q:['你喜欢哪个足球运动员？','Nǐ xǐhuan nǎge zúqiú yùndòngyuán?'],opts:STARS.map(s=>({k:s.id,c:s.zh,cp:s.py}))},
 {id:'want',q:['你想当什么？','Nǐ xiǎng dāng shénme?'],isNew:1,opts:[['zq','足球运动员','zúqiú yùndòngyuán','⚽'],['jiaolian','教练','jiàoliàn','📣'],['yisheng','医生','yīshēng','🩺'],['laoshi','老师','lǎoshī','📚'],['gongchengshi','工程师','gōngchéngshī','🏗️']].map(([k,c,cp,e])=>({k,c,cp,e}))}
];
const IVS={};
function ivLine(id){
  const v=IVS[id];if(v==null)return null;const r=IV.find(x=>x.id===id);const o=r.opts.find(x=>x.k===v);
  if(id==='dad')return [`我爸爸是${o.c}。`,`Wǒ bàba shì ${o.cp}.`];
  if(id==='mom'){const same=IVS.dad===v;return [`我妈妈${same?'也':''}是${o.c}。`,`Wǒ māma ${same?'yě ':''}shì ${o.cp}.`]}
  if(id==='sib')return v==='0'?['我没有兄弟姐妹。','Wǒ méiyǒu xiōngdì jiěmèi.']:[`我有一个${o.c}。`,`Wǒ yǒu yí ge ${o.cp}.`];
  if(id==='kou')return [`我家有${o.c}。`,`Wǒ jiā yǒu ${o.cp}.`];
  if(id==='star')return [`我喜欢${o.c}。`,`Wǒ xǐhuan ${o.cp}.`];
  if(id==='want')return [`我想当${o.c}！`,`Wǒ xiǎng dāng ${o.cp}!`];
}
function interview(){
  const draw=()=>{
    const ready=IV.every(r=>IVS[r.id]!=null);
    app.innerHTML=`<section class="screen">
     <div class="row"><button class="back" id="bk">← Меню</button></div>
     <h1 class="t" style="margin-top:12px"><span class="zh">采访</span>Интервью после матча</h1>
     <p class="sub">Репортёр Панда берёт интервью у звезды «阿斯凯 FC». Нажми 🔊 и послушай вопрос, потом выбери ответ про себя.</p>
     <div class="iv"><div>${IV.map(r=>`<div class="qrow ${IVS[r.id]==null?'need':''}"><div class="qq"><button class="sbtn" data-q="${r.id}" aria-label="Послушать вопрос">🔊</button><div>${zp(r.q[0],r.q[1])}</div>${r.isNew?'<span class="new">НОВОЕ</span>':''}</div>
       <div class="chips">${r.opts.map(o=>`<button class="chip ${IVS[r.id]===o.k?'on':''}" data-r="${r.id}" data-k="${o.k}">${o.e?`<span class="e">${o.e}</span>`:''}<span class="zh">${o.c}</span><span class="py">${o.cp}</span></button>`).join('')}</div></div>`).join('')}</div>
      <div class="mic"><h3>🎙️ В эфире: <span class="zh">阿斯凯</span></h3>
       <div class="l"><span class="zh">大家好！我叫阿斯凯。</span><span class="py">Dàjiā hǎo! Wǒ jiào Āsīkǎi.</span></div>
       ${IV.map(r=>{const l=ivLine(r.id);return l?`<div class="l"><span class="zh">${l[0]}</span><span class="py">${l[1]}</span></div>`:'<div class="l empty">……</div>'}).join('')}
       <div class="row" style="margin-top:12px"><button class="cta" id="air" ${ready?'':'disabled style="opacity:.5"'}>▶ В эфир!</button></div></div>
     </div></section>`;
    $('#bk').onclick=home;
    app.querySelectorAll('.qq .sbtn').forEach(b=>b.onclick=()=>speak(IV.find(r=>r.id===b.dataset.q).q[0]));
    app.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const r=IV.find(x=>x.id===c.dataset.r);const k=r.opts.find(o=>String(o.k)===c.dataset.k).k;IVS[r.id]=k;const l=ivLine(r.id);speak(l[0]);const y=window.scrollY;draw();window.scrollTo(0,y)});
    const air=$('#air');if(ready)air.onclick=()=>{sWhistle();speak('大家好！我叫阿斯凯。'+IV.map(r=>ivLine(r.id)[0]).join('')+'谢谢！')};
  };
  draw();
}

/* 8. Season final: mixed penalties */
function final(){
  const items=shuffle([...clubItems(3),...passItems(3),...famItems(3),...guessItems(3)]);
  quiz({title:'Финал сезона',items,penalty:true,modId:'final',again:final});
}
