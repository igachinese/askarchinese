<!doctype html><html lang="ru"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Аскар FC · Китайский через игру</title><meta name="description" content="Игровой урок китайского с Пандой: профессии, семья, знакомство и футбольные игры для детей от 7 лет.">

<meta name="claude:viewport-fit-sides" content="cover">

<style>

/* Layout: sticky club header; home = season plan (4 lessons → modules); each module is one focused screen. The sticker album is the spine of the site. */

:root{

  --bg:#eef4ee;

  --page:#ffffff;

  --ink:#152a24;

  --muted:#5a6f68;

  --line:#cfe0d6;

  --club:#123d2e;

  --club-2:#1c5a43;

  --grass:#3c8e4c;

  --grass-2:#47a058;

  --gold:#e8b21f;

  --gold-soft:#fff3cc;

  --red:#e0483a;

  --red-d:#a92d22;

  --teal:#17807e;

  --ok:#2f9e5b;

  --ok-soft:#ddf3e5;

  --bad:#d6403f;

  --bad-soft:#fde5e3;

  --f-body:"Trebuchet MS","Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;

  --f-zh:"PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;

  color-scheme:light;

}

*{box-sizing:border-box}

html,body{min-height:100%}

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;overflow-x:hidden}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--club)}

.zh{font-family:var(--f-zh);font-weight:700}

.py{font-weight:700;color:var(--teal);font-size:.8em}

body.nopy .py{display:none}

button{font:inherit;color:inherit;cursor:pointer}

button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}



header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--club);color:#fff;

  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));

  display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 4px 16px rgba(5,30,20,.3)}

.badge{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;padding:0;text-align:left}

.badge svg{width:40px;height:40px;flex:none}

.badge b{display:block;font-weight:900;font-size:1.05rem;line-height:1.1}

.badge small{display:block;opacity:.75;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-weight:800}

.hstat{display:flex;gap:10px;margin-left:auto;font-weight:900;align-items:center}

.hstat span{background:rgba(255,255,255,.12);border-radius:10px;padding:4px 10px;font-variant-numeric:tabular-nums}

.tools{display:flex;gap:6px;flex-wrap:wrap}

.tbtn{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:6px 10px;font-weight:800;font-size:.82rem;white-space:nowrap}

.tbtn[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}

.warn{background:var(--gold-soft);color:#6b4b00;font-weight:700;font-size:.88rem;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid #f0d58a}



main{max-width:980px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.screen{animation:in .3s ease both}

@keyframes in{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}

h1.t{margin:0 0 4px;font-size:clamp(1.4rem,4.4vw,2rem);font-weight:900;text-wrap:balance}

h1.t .zh{color:var(--red);margin-right:8px}

.sub{color:var(--muted);font-weight:700;margin:0 0 14px}

.back{background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800;color:var(--muted)}

.cta{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--red);color:#fff;border:0;border-radius:14px;padding:13px 24px;font-weight:900;font-size:1.1rem;box-shadow:0 6px 0 var(--red-d);transition:transform .1s,box-shadow .1s}

.cta:active{transform:translateY(4px);box-shadow:0 2px 0 var(--red-d)}

.cta.green{background:var(--club-2);box-shadow:0 6px 0 var(--club)}

.cta.green:active{box-shadow:0 2px 0 var(--club)}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.spacer{flex:1}



/* home */

.hero{background:linear-gradient(135deg,var(--club) 0%,var(--club-2) 100%);color:#fff;border-radius:22px;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;overflow:hidden;position:relative}

.hero h1{margin:0;font-size:clamp(1.6rem,5vw,2.4rem);font-weight:900;text-wrap:balance}

.hero h1 .zh{display:block;color:var(--gold);font-size:.7em;letter-spacing:.12em}

.hero p{margin:8px 0 0;opacity:.9;font-weight:700;max-width:52ch}

.hero .ball{font-size:5rem;line-height:1}

.lessons{display:grid;gap:14px;margin-top:18px;grid-template-columns:repeat(2,minmax(0,1fr))}

.lesson{background:var(--page);border-radius:18px;padding:14px;box-shadow:0 6px 18px rgba(20,60,40,.08);min-width:0}

.lesson h2{margin:0 0 2px;font-size:1.1rem;font-weight:900;display:flex;gap:8px;align-items:center}

.lesson h2 .n{background:var(--club);color:var(--gold);border-radius:8px;padding:2px 8px;font-size:.8rem;letter-spacing:.06em}

.lesson p{margin:0 0 10px;color:var(--muted);font-weight:700;font-size:.9rem}

.mods{display:grid;gap:8px}

.mod{display:flex;align-items:center;gap:12px;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:10px 12px;text-align:left;width:100%}

.mod:hover{border-color:var(--grass)}

.mod .ic{font-size:1.8rem;flex:none;width:44px;text-align:center}

.mod b{display:block;font-size:1rem}

.mod span{display:block;color:var(--muted);font-size:.84rem;font-weight:700}

.mod .sc{margin-left:auto;font-weight:900;color:var(--club-2);white-space:nowrap;font-variant-numeric:tabular-nums}



/* word cards */

.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

.wcard{background:var(--page);border:3px solid var(--line);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;position:relative;min-width:0}

.wcard:hover{border-color:var(--grass)}

.wcard .emo{font-size:2.6rem;line-height:1.1}

.wcard .zh{font-size:1.5rem}

.wcard .ru{color:var(--muted);font-weight:700;font-size:.88rem}

.wcard .tb{position:absolute;top:6px;right:8px;font-size:.62rem;font-weight:900;letter-spacing:.05em;color:#fff;background:var(--teal);border-radius:5px;padding:1px 5px}

.wcard .tb.ex{background:var(--gold);color:var(--ink)}

.wcard.flip .ru{display:none}

.grammar{margin-top:18px;background:var(--page);border-radius:18px;padding:14px 16px;border-left:6px solid var(--gold)}

.grammar h3{margin:0 0 8px;font-size:1rem}

.gl{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}

.gl:last-child{border-bottom:0}

.gl .zh{font-size:1.25rem}

.gl .ru{color:var(--muted);font-weight:700;font-size:.9rem}

.sbtn{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--gold);font-size:1.1rem;box-shadow:0 3px 0 #b88a0e}

.sbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #b88a0e}



/* quiz */

.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

.qhead h1{margin:0;font-size:clamp(1.2rem,3.6vw,1.6rem);font-weight:900}

.dots{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}

.dot{width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--line)}

.dot.ok{background:var(--ok);border-color:var(--ok)}.dot.miss{background:var(--gold);border-color:var(--gold)}.dot.cur{border-color:var(--club);transform:scale(1.25)}

.score{display:flex;gap:8px;align-items:center;margin-left:auto;font-weight:900;font-size:1.2rem;font-variant-numeric:tabular-nums}

.score span{background:var(--club);color:#fff;border-radius:10px;padding:3px 10px}

.prompt{background:var(--page);border-radius:20px;padding:14px 16px;box-shadow:0 8px 22px rgba(20,60,40,.1)}

.prompt .ask{font-weight:900;color:var(--muted);font-size:.95rem}

.prompt .scene{font-size:clamp(2.6rem,11vw,4rem);text-align:center;line-height:1.2;margin:6px 0}

.qline{display:flex;align-items:center;gap:12px;margin-top:6px}

.qline .face{font-size:2.4rem;flex:none;line-height:1}

.qline .q{flex:1;min-width:0;font-size:clamp(1.3rem,4.6vw,1.9rem);line-height:1.25}

.qline .q.hid{color:transparent;background:repeating-linear-gradient(90deg,var(--line) 0 16px,transparent 16px 24px);height:.9em;border-radius:6px;max-width:320px}

.listen{flex:none;width:62px;height:62px;border-radius:50%;border:0;background:var(--gold);font-size:1.7rem;box-shadow:0 4px 0 #b88a0e;display:grid;place-items:center}

.listen:active{transform:translateY(3px);box-shadow:0 1px 0 #b88a0e}

.listen.pulse{animation:pulse 1.3s infinite}

@keyframes pulse{0%{box-shadow:0 4px 0 #b88a0e,0 0 0 0 rgba(232,178,31,.6)}70%{box-shadow:0 4px 0 #b88a0e,0 0 0 16px rgba(232,178,31,0)}100%{box-shadow:0 4px 0 #b88a0e,0 0 0 0 rgba(232,178,31,0)}}

.hint{margin-top:8px;color:var(--muted);font-weight:800;font-size:.9rem}

.opts{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px}

@media(min-width:760px){.opts.four{grid-template-columns:repeat(4,minmax(0,1fr))}}

.opt{background:var(--page);border:3px solid var(--line);border-radius:16px;padding:12px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-width:0;transition:transform .12s,border-color .2s,background .2s}

.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--teal)}

.opt .emo{font-size:2.6rem;line-height:1.1}

.opt .zh{font-size:clamp(1.15rem,4vw,1.5rem);line-height:1.25}

.opt .rev{display:none}

.opts.done .opt .rev{display:block}

.opt.ok{border-color:var(--ok);background:var(--ok-soft)}

.opt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}

.opts.done .opt:not(.ok){opacity:.5}

.opt:disabled{cursor:default}

.opt svg.jersey{width:84px;height:84px}

@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.after{margin-top:14px;background:var(--club);color:#fff;border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}

.after .say{flex:1;min-width:200px}

.after small{display:block;font-weight:800;opacity:.85}

.after .zh{display:block;font-size:clamp(1.4rem,5vw,2rem);color:#ffe28a;line-height:1.25}

.after .py{color:#bfeadb;font-size:.95rem}

.after .ru{display:block;opacity:.9;font-weight:700}

.after .mini{background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800}

.foot{display:flex;justify-content:space-between;gap:10px;margin-top:14px}



/* penalty strip */

.pitch{position:relative;height:130px;border-radius:16px;overflow:hidden;margin-top:12px;background:repeating-linear-gradient(90deg,var(--grass) 0 44px,var(--grass-2) 44px 88px)}

.goal{position:absolute;left:50%;top:8px;width:min(230px,70%);height:76px;transform:translateX(-50%);border:5px solid #fff;border-bottom:0;border-radius:6px 6px 0 0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 2px,transparent 2px 10px),repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 2px,transparent 2px 10px),rgba(10,40,25,.25)}

.keeper{position:absolute;left:50%;bottom:44px;margin-left:-20px;font-size:2.5rem;line-height:1;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}

.pball{position:absolute;left:50%;bottom:6px;margin-left:-16px;font-size:2rem;line-height:1;transition:transform .5s cubic-bezier(.2,.8,.3,1)}

.pbig{position:absolute;left:12px;bottom:8px;max-width:46%;color:#fff;font-weight:900;font-size:1.15rem;text-shadow:0 2px 6px rgba(0,0,0,.45);opacity:0;transition:opacity .25s}

.pbig.on{opacity:1}



/* album */

.album{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}

.slot{position:relative;border-radius:18px;padding:10px;background:var(--page);border:3px dashed var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:210px;min-width:0}

.slot .num{position:absolute;top:8px;left:10px;font-weight:900;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}

.slot .flag{position:absolute;top:8px;right:8px;width:34px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.2)}

.slot svg.jersey{width:110px;height:110px;margin-top:10px}

.slot .nm{font-size:1.25rem}

.slot .ru{font-weight:800;color:var(--muted);font-size:.85rem}

.slot.empty svg.jersey{filter:grayscale(1) opacity(.35)}

.slot.empty .nm{color:#9fb3aa}

.slot.glued{border:3px solid var(--gold);background:linear-gradient(160deg,#fffdf3 0%,#fff 55%,#fff6d6 100%);box-shadow:0 8px 20px rgba(160,120,10,.18)}

.slot.glued::after{content:"";position:absolute;inset:0;border-radius:15px;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.65) 45%,transparent 60%);background-size:250% 100%;animation:shine 3.5s infinite}

@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}

.slot .tag{font-size:.75rem;font-weight:900;color:var(--club-2);background:var(--ok-soft);border-radius:8px;padding:2px 8px}

.slot.empty .tag{background:var(--gold-soft);color:#6b4b00}

.progress{height:12px;background:var(--page);border-radius:8px;overflow:hidden;margin:4px 0 16px;border:1px solid var(--line)}

.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--grass))}



/* dossier */

.dos{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}

.dos .pic{background:var(--page);border-radius:20px;padding:12px;text-align:center;box-shadow:0 8px 22px rgba(20,60,40,.1)}

.dos .pic svg.jersey{width:170px;height:170px}

.dos .pic .flag{width:60px;border-radius:5px;box-shadow:0 1px 4px rgba(0,0,0,.2)}

.dos .pic .nm{font-size:1.6rem;display:block}

.lines{background:var(--page);border-radius:20px;padding:10px 14px;box-shadow:0 8px 22px rgba(20,60,40,.1)}

.ln{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}

.ln:last-child{border-bottom:0}

.ln .vis{font-size:1.9rem;flex:none;width:96px;text-align:center;line-height:1.1}

.ln .txt{flex:1;min-width:0}

.ln .txt .zh{font-size:1.3rem}

body.hidetxt .ln .txt .zh,body.hidetxt .ln .txt .py{filter:blur(7px)}

.fact{margin-top:12px;background:var(--gold-soft);border-radius:14px;padding:10px 14px;font-weight:700}



/* interview */

.iv{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}

.qrow{background:var(--page);border-radius:16px;padding:10px 12px;margin-bottom:10px;border:2px solid transparent}

.qrow.need{border-color:var(--gold)}

.qrow .qq{display:flex;align-items:center;gap:8px;margin-bottom:8px}

.qrow .qq .zh{font-size:1.1rem}

.qrow .qq .new{background:var(--red);color:#fff;font-size:.62rem;font-weight:900;padding:1px 6px;border-radius:5px}

.chips{display:flex;flex-wrap:wrap;gap:7px}

.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:5px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.2}

.chip .zh{font-size:1.05rem}

.chip .e{font-size:1.2rem}

.chip.on{border-color:var(--ok);background:var(--ok-soft)}

.mic{position:sticky;top:76px;background:var(--club);color:#fff;border-radius:20px;padding:16px}

.mic h3{margin:0 0 8px;display:flex;gap:8px;align-items:center}

.mic .l{padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.2)}

.mic .l .zh{font-size:1.15rem;color:#ffe28a}

.mic .l .py{color:#bfeadb;display:block}

.mic .l.empty{opacity:.45}



/* end */

.final{background:var(--page);border-radius:22px;padding:22px;text-align:center;box-shadow:0 10px 30px rgba(20,60,40,.12)}

.final .cup{font-size:4rem;line-height:1}

.final h1{margin:6px 0;font-size:clamp(1.5rem,5vw,2.2rem);font-weight:900;text-wrap:balance}

.final .big{font-size:2.6rem;font-weight:900;font-variant-numeric:tabular-nums}

.teacher{margin-top:16px;background:var(--bg);border-radius:14px;padding:12px 16px;text-align:left}

.teacher h3{margin:0 0 6px;font-size:1rem}

.teacher ul{margin:0;padding-left:20px;display:grid;gap:4px}

.teacher li small{display:block;color:var(--muted);font-weight:700}

.ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,30,20,.6);padding:20px}

.stick{background:var(--page);border-radius:24px;padding:22px;text-align:center;max-width:360px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}

@keyframes pop{from{transform:scale(.3) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}

.stick svg.jersey{width:150px;height:150px}

.stick h2{margin:6px 0 2px;font-size:1.5rem}



@media(max-width:760px){.lessons{grid-template-columns:1fr}.dos,.iv{grid-template-columns:1fr}.mic{position:static}.hero{grid-template-columns:1fr}.hero .ball{display:none}}

@media(max-width:480px){.badge small{display:none}.ln .vis{width:64px;font-size:1.5rem}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.star-portrait{display:block;width:min(100%,144px);aspect-ratio:1;object-fit:cover;border-radius:15px;background:#e9e5d3}

.stars-album{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));margin-top:18px}

.stars-album .slot{min-height:0;gap:8px}

.stars-album .slot:hover,.stars-album .slot:focus-visible{border-color:var(--club)}

.stars-album .slot .ru{color:var(--ink)}

.star-cup .scene .star-portrait{width:clamp(88px,25vw,148px)}

.star-cup .qline{justify-content:center;flex-wrap:wrap}

.star-cup .qline .q.hid{display:none}

.star-cup .star-audio{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.star-cup .star-audio button{min-height:44px}

.star-cup .star-audio .cta{padding:8px 16px}

.star-cup .star-context{margin:12px 0 0;text-align:center;font-weight:700}

.star-cup .star-feedback:not(:empty){margin:10px 0 0;color:var(--club);font-weight:700}

.star-cup .opt{min-height:102px;gap:8px}

.star-cup .opt .star-portrait{width:min(100%,110px)}

.star-cup .option-label{text-align:center;font-weight:800;overflow-wrap:anywhere}

.star-sticker .star-portrait{width:150px;margin:0 auto 12px}

@media(min-width:721px){.games-row{grid-template-columns:repeat(2,minmax(0,1fr))}}

@media(min-width:1400px){.games-row{grid-template-columns:repeat(4,minmax(0,1fr))}}

</style>

<script>

(function(){

const $=s=>document.querySelector(s);

const app=$('#app'),ovEl=$('#ov');let screenSession=0,currentModule='home',speechNonce=0;

const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const pick=(a,n)=>shuffle(a).slice(0,n);

const zp=(zh,py)=>`<span class="zh">${esc(zh)}</span>${py?`<br><span class="py">${esc(py)}</span>`:''}`;



/* Browser voices: preserve a named choice, report every fallback honestly. */

const synth=window.speechSynthesis||null;

const VOICE_KEY='askarFC_voice_v2';

const voicePrefs=(()=>{try{return JSON.parse(localStorage.getItem(VOICE_KEY)||'{}')||{}}catch{return {}}})();

let voiceProfile=voicePrefs.profile==='child'?'child':'xiaoyi';

let slow=voicePrefs.slow===true,voice=null,zhVoices=[],vi=0,kid=false;

function saveVoicePrefs(){try{localStorage.setItem(VOICE_KEY,JSON.stringify({profile:voiceProfile,slow}))}catch{}}

function findVoice(pattern){return zhVoices.find(v=>pattern.test(v.name+' '+(v.voiceURI||'')))||null}

function shortVoiceName(v){

 if(!v)return 'Китайский голос пока не найден';

 const known=[[/xiaoyi|晓伊|曉伊/i,'晓伊 (Xiaoyi)'],[/xiaoshuang|晓双|曉雙/i,'晓双 (Xiaoshuang)'],[/xiaoyou|晓悠|曉悠/i,'晓悠 (Xiaoyou)'],[/yunxia|云夏|雲夏/i,'云夏 (Yunxia)']];

 return known.find(([rx])=>rx.test(v.name+' '+(v.voiceURI||'')))?.[1]||v.name.replace(/Microsoft |Google | Online|\(Natural\)/g,'').trim();

}

function voiceConfig(profile=voiceProfile){

 const xiaoyi=findVoice(/xiaoyi|晓伊|曉伊/i);

 if(profile==='xiaoyi'){

  const v=xiaoyi||zhVoices[0]||null;

  return {voice:v,pitch:1,label:xiaoyi?'晓伊 · Chinese':v?shortVoiceName(v):'晓伊 · Chinese',detail:xiaoyi?'Голос с картинки. Естественный тон.':v?'晓伊 не найден на устройстве. Сейчас доступен '+shortVoiceName(v)+'.':'Браузер пока не предоставил китайские голоса. Выбор сохранён: 晓伊.',fallback:!xiaoyi};

 }

 const child=findVoice(/xiaoshuang|晓双|曉雙/i)||findVoice(/xiaoyou|晓悠|曉悠/i);

 if(child)return {voice:child,pitch:1,label:shortVoiceName(child),detail:'Отдельный детский голос. Естественный тон.',fallback:false};

 const youthful=findVoice(/yunxia|云夏|雲夏/i);

 if(youthful)return {voice:youthful,pitch:1.12,label:'云夏 (Yunxia)',detail:'Другой голос: 云夏. Для детского звучания тон немного выше.',fallback:false};

 const v=xiaoyi||zhVoices[0]||null;

 return {voice:v,pitch:1.22,label:v?shortVoiceName(v)+' · выше тон':'Детское звучание',detail:v?'Отдельный детский голос не найден. Используется '+shortVoiceName(v)+' с более высоким тоном.':'После загрузки голосов будет выбран детский голос или доступный китайский голос с более высоким тоном.',fallback:true};

}

function voiceSummary(){const c=voiceConfig();return c.voice?c.label+'. '+c.detail:'Китайского голоса пока нет. В заданиях можно открыть текст-подсказку.'}

function updateVoiceControls(){

 const c=voiceConfig();

 const b=$('#tVoice');if(b){b.textContent=voiceProfile==='child'?'♪ Детский':'♪ 晓伊';b.title='Выбрать голос · '+c.detail;b.setAttribute('aria-label','Выбрать голос: '+(voiceProfile==='child'?'Детское звучание':'晓伊 — Chinese'))}

 $('#tSlow')?.setAttribute('aria-pressed',String(slow));

 const st=$('#voice-status');if(st)st.textContent=voiceSummary();

 const panel=$('#voice-picker-content');if(panel)drawVoicePicker();

}

function pickVoice(){

 const rank=v=>/xiaoyi|晓伊|曉伊/i.test(v.name)?0:/xiaoshuang|xiaoyou|晓双|晓悠/i.test(v.name)?1:/yunxia|云夏/i.test(v.name)?2:/zh[-_]CN/i.test(v.lang)?3:/^zh|^cmn/i.test(v.lang)?4:9;

 zhVoices=(synth?synth.getVoices():[]).filter(v=>rank(v)<9).sort((a,b)=>rank(a)-rank(b)||a.name.localeCompare(b.name));

 voice=voiceConfig().voice;vi=Math.max(0,zhVoices.indexOf(voice));

 $('#warn').hidden=true;updateVoiceControls();

}

function setVoiceProfile(profile){

 voiceProfile=profile==='child'?'child':'xiaoyi';speechNonce++;if(synth)synth.cancel();saveVoicePrefs();pickVoice();

}

function setSlowVoice(on){slow=on;saveVoicePrefs();updateVoiceControls();const b=$('#teacher-slow');if(b)b.textContent=slow?'Обычная скорость':'Медленнее'}

function drawVoicePicker(){

 const panel=$('#voice-picker-content');if(!panel)return;

 const focused=document.activeElement?.id;

 const a=voiceConfig('xiaoyi'),b=voiceConfig('child');

 panel.innerHTML=`<p class="voice-intro">Выбери голос для всех слов и игр. Можно послушать пример перед уроком.</p><div class="voice-options">${[['xiaoyi','晓伊 — Chinese','Xiaoyi · как на картинке',a],['child','Детское звучание','Второй вариант для урока',b]].map(([id,title,sub,c])=>`<button class="voice-option ${voiceProfile===id?'selected':''}" id="voice-choice-${id}" data-voice-profile="${id}" aria-pressed="${voiceProfile===id}"><span class="voice-option-mark">${voiceProfile===id?'✓':'♪'}</span><strong>${title}</strong><small>${sub}</small><span class="voice-real-name">${esc(c.label)}</span></button>`).join('')}</div><div class="voice-description" role="status"><strong>Сейчас: ${esc(voiceConfig().label)}</strong><p>${esc(voiceConfig().detail)}</p></div><div class="voice-actions"><button class="cta" id="voice-preview" ${voice?'':'disabled'}>🔊 Послушать пример</button><button class="back" id="voice-slow" aria-pressed="${slow}">${slow?'✓ Медленнее':'Медленнее'}</button></div><p class="voice-tip">Список голосов зависит от устройства и браузера. Если нужного голоса нет, это указано выше.</p><div class="row" style="justify-content:space-between"><button class="back" id="voice-refresh">Обновить список</button><button class="back" id="voice-done">Готово ✓</button></div>`;

 panel.querySelectorAll('[data-voice-profile]').forEach(x=>x.onclick=()=>setVoiceProfile(x.dataset.voiceProfile));

 $('#voice-preview').onclick=()=>speak('你好！我叫阿斯凯。我七岁。我想当足球运动员！');

 $('#voice-slow').onclick=()=>setSlowVoice(!slow);$('#voice-refresh').onclick=pickVoice;$('#voice-done').onclick=closeVoicePicker;

 if(focused&&panel.querySelector('#'+focused))panel.querySelector('#'+focused).focus();

}

let voiceReturnFocus=null;

function closeVoicePicker(){ovEl.innerHTML='';(voiceReturnFocus?.isConnected?voiceReturnFocus:$('#tVoice'))?.focus()}

function voicePicker(){

 voiceReturnFocus=document.activeElement;

function speak(text,{slower=slow,manual=false}={}){

 pausePandaClip();

 const call=++speechNonce,lesson=screenSession;

 return new Promise(res=>{

  if(!synth){toast('Озвучка недоступна в этом браузере. Используй текст-подсказку.');res();return}

  pickVoice();const config=voiceConfig();

  if(!config.voice){toast('Китайский голос не найден. Можно открыть текст-подсказку или повторить с учителем.');res();return}

  synth.cancel();

   const play=()=>{

   if(call!==speechNonce||lesson!==screenSession){res();return}

   const u=new SpeechSynthesisUtterance(text);

   u.lang=config.voice.lang||'zh-CN';u.voice=config.voice;u.rate=slower?0.65:0.85;u.pitch=config.pitch;

   const timeout=setTimeout(finish,2500+text.length*(slower?520:330));

   function finish(){clearTimeout(timeout);res()}

   u.onend=finish;

   u.onerror=event=>{

    if(manual&&call===speechNonce&&lesson===screenSession&&!['interrupted','canceled'].includes(event.error)){

     toast('Не удалось включить озвучку. Попробуй нажать ещё раз или выбрать другой голос.');

    }

    finish();

   };

   synth.speak(u);

  };

  if(manual)play();else setTimeout(play,70);

 });

}

/* item: {ask, say, sayPy, show(bool: show question text), scene, face, cls:'four'|'', options:[{html, ok, why}], after:{zh,py,ru}, hint} */

function quiz(cfg){

  const mySession=++screenSession;

  const {title,items,penalty,onDone,modId,guided,backTo}=cfg;

  let i=0,a=0,p=0;const res=[],miss=[];

  const show=()=>{

    if(mySession!==screenSession)return;

    const it=items[i];let tried=false,solved=false;

    const opts=shuffle(it.options);

    app.innerHTML=`<section class="screen ${guided?'star-cup':''}">

     <div class="qhead"><button class="back" id="bk">${backTo?'← Кубок':'← Меню'}</button><h1>${title}</h1>

      ${penalty?`<div class="score">🧒 <span id="sa">${a}</span> : <span id="sp">${p}</span> 🐼</div>`:`<div class="dots">${items.map((_,k)=>`<span class="dot ${res[k]===1?'ok':res[k]===2?'miss':''} ${k===i?'cur':''}"></span>`).join('')}</div>`}</div>

     <div class="prompt"><div class="ask">${esc(it.ask)} <span style="float:right">${i+1}/${items.length}</span></div>

      ${it.scene?`<div class="scene" aria-hidden="true">${it.scene}</div>`:''}

      ${it.say?`<div class="qline"><span class="face">${it.face||'🐼'}</span><div class="q ${it.show?'':'hid'}" id="qt">${it.show?zp(it.say,it.sayPy):'?'}</div>${guided?'':'<button class="listen pulse" id="lis" aria-label="Послушать">🔊</button>'}</div>`:''}

      ${guided?`<div class="star-audio"><button class="cta" id="lis">🔊 Послушать</button><button class="back" id="star-slow">🐢 Медленно</button><button class="back" id="show-word" aria-expanded="false">Подсказка</button></div><p class="star-feedback" role="status"></p>`:it.say&&!it.show?'<button class="back" id="show-word" style="margin-top:15px">Показать текст-подсказку</button>':''}

      ${it.hint?`<div class="hint">${esc(it.hint)}</div>`:''}

     </div>

     ${penalty?'<div class="pitch"><div class="goal"></div><div class="keeper" id="kp">🐼</div><div class="pball" id="pb">⚽</div><div class="pbig" id="pg"></div></div>':''}

     ${penalty?'<div id="aft"></div>':''}

     <div class="opts ${it.cls||''}" id="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.html}</button>`).join('')}</div>

     ${penalty?'':'<div id="aft"></div>'}

    </section>`;

    window.scrollTo(0,0);

    $('#bk').onclick=()=>{if(backTo)go(backTo);else home()};

    const showClue=()=>{

      const question=$('#qt');

      question.classList.remove('hid');

      question.innerHTML=zp(it.say,it.sayPy);

      const hint=$('#show-word');

      if(guided&&hint){hint.setAttribute('aria-expanded','true');hint.disabled=true}

      else hint?.remove();

    };

    if($('#show-word'))$('#show-word').onclick=showClue;

    if(it.say){

      const lis=$('#lis');

      const play=manual=>{if(!lis.isConnected||(!manual&&solved)||mySession!==screenSession)return;lis.classList.remove('pulse');speak(it.say,{manual})};

      const autoplay=guided?null:setTimeout(()=>play(false),380);

      lis.onclick=()=>{clearTimeout(autoplay);play(true)};

      if(guided)$('#star-slow').onclick=()=>speak(it.say,{slower:true,manual:true});

    }

    const shoot=ok=>{if(!penalty)return;const b=$('#pb'),k=$('#kp'),g=$('#pg'),sd=Math.random()<.5?-1:1;

      requestAnimationFrame(()=>{if(ok){b.style.transform=`translate(${sd*70}px,-84px) scale(.55)`;k.style.transform=`translateX(${-sd*56}px) rotate(${-sd*50}deg)`;g.textContent='ГОООЛ! ⚽'}

      else{b.style.transform='translate(0,-52px) scale(.6)';k.style.transform='translateY(-14px) scale(1.25)';g.textContent='Панда отбила! 🧤'}g.classList.add('on')})};

    app.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{

      if(solved)return;const o=opts[+btn.dataset.k];

      if(o.ok){

        solved=true;btn.classList.add('ok');$('#opts').classList.add('done');app.querySelectorAll('.opt').forEach(x=>x.disabled=true);

        if(!tried){res[i]=1;a++;SV.stars++;save();hdr();sOk();shoot(true)}else res[i]=2;

        if(!guided&&!it.show&&it.say)showClue();

        if(guided)$('.star-feedback').textContent='Верно!';

        if(penalty){$('#sa').textContent=a;$('#sp').textContent=p}

        const af=it.after;

        if(af){

          $('#aft').innerHTML=`<div class="after"><div class="say" aria-live="polite"><small>Послушай и повтори</small><span class="zh" lang="zh-CN">${esc(af.zh)}</span><span class="py">${esc(af.py)}</span>${af.ru?`<span class="ru">${esc(af.ru)}</span>`:''}${af.context?`<p class="phrase-context">${esc(af.context)}</p>`:''}</div><div class="phrase-actions"><button class="mini play-phrase" id="ag">🔊 Послушать фразу</button><button class="mini" id="ag-slow">🐢 Медленно</button></div><button class="cta green" id="nx">${i+1<items.length?'Дальше →':'Итог →'}</button></div>`;

          $('#ag').onclick=()=>speak(af.zh,{manual:true});

          $('#ag-slow').onclick=()=>speak(af.zh,{slower:true,manual:true});

          $('#nx').onclick=next;

          if(!guided)speak(af.zh,{manual:true});

          $('#aft').scrollIntoView({behavior:'smooth',block:'nearest'});

        }else setTimeout(next,1200);

      }else{

        if(guided){

          $('.star-feedback').textContent='Попробуй ещё. Можно послушать медленнее или открыть подсказку.';

        }else{btn.classList.add('bad');btn.disabled=true;sBad()}

        if(!tried){tried=true;p++;shoot(false);if(penalty)$('#sp').textContent=p;

          miss.push({q:it.say||it.ask,ans:(it.after&&it.after.zh)||'',picked:btn.innerText.replace(/\s+/g,' ').trim()})}

        if(it.say&&!guided){

          const itemIndex=i;

          setTimeout(()=>{if(mySession===screenSession&&i===itemIndex&&!solved)speak(it.say)},500);

        }

      }

    });

  };

  const next=()=>{if(mySession!==screenSession)return;speechNonce++;synth?.cancel();i++;if(i<items.length)show();else{

    if(modId){SV.best[modId]=Math.max(SV.best[modId]||0,a);markDone(modId);save()}

    onDone?onDone({a,p,n:items.length,miss}):result({title,a,p,n:items.length,miss,penalty,modId,again:cfg.again})}};

  show();

}

function starItems(s){

  };

    };

  }else{

    const siblings=['g','j','d','m'];

    const member=siblings.find(k=>s.sib?.[k]);

    const index=member?siblings.indexOf(member)+2:s.bro?4:2;

    const person=FAMILY[index];

    const phrase={zh:`我有${person.zh}。`,py:`Wǒ yǒu ${person.py}.`,ru:`У меня есть ${person.ru}.`};

    const other=index===2||index===4?5:2;

    second={

      say:phrase.zh,sayPy:phrase.py,after:phrase,

      options:[index,other].map(i=>starOption(sprite(i,'family'),FAMILY[i].ru,i===index)),

    };

  }

  return [first,second].map(item=>({...item,scene:starPortrait(s)}));

}

function sibVariants(sib){

  const key=JSON.stringify(sib);const out=[];const seen=new Set([key]);

  const cands=[{g:1},{j:1},{d:1},{m:1},{g:2},{j:2},{g:1,m:1},{j:1,d:1},{g:2,m:1},{g:1,j:2},{g:1,d:1},{j:1,m:1},{d:1,m:1},{g:1,j:1},{d:2},{m:2}];

  shuffle(cands).forEach(c=>{const k=JSON.stringify(c);if(out.length<3&&!seen.has(k)){seen.add(k);out.push(c)}});

  return out;

}

function pandaText(cue){

 const [, ,zh,py,ru]=cue;

 return `<span class="panda-line"><b lang="zh-CN">${zh}</b><span class="py">${py}</span><span>${ru}</span></span>`;

}



function pandaClip(key){

 const clip=PANDA_CLIPS[key], file=`assets/panda-${key}`;

 return `<figure class="panda-clip" data-panda-clip="${key}">

  <video controls playsinline preload="metadata" poster="${file}.webp" aria-label="${clip.title}" src="${file}.mp4"></video>

  <figcaption>

   <div class="panda-actions">

    <button class="back" data-panda-play>▶ Послушать Панду</button>

    <button class="back" data-panda-text aria-expanded="false">${clip.hideAnswer?'Показать подсказку':'Читать реплики'}</button>

   </div>

   <div class="panda-text" hidden>${[...new Set(clip.cues.map(pandaText))].join('')}</div>

   <div class="panda-caption" hidden></div>

   <div class="panda-error" role="status" hidden>Видео не загрузилось. Можно прочитать реплику и продолжить.</div>

  </figcaption>

 </figure>`;

}



function pausePandaClip(){

 app.querySelector('.panda-clip video')?.pause();

}



function bindPandaClip(){

 const player=app.querySelector('.panda-clip');

 if(!player)return;

 const clip=PANDA_CLIPS[player.dataset.pandaClip];

 const video=player.querySelector('video');

 const play=player.querySelector('[data-panda-play]');

 const textButton=player.querySelector('[data-panda-text]');

 const transcript=player.querySelector('.panda-text');

 const captions=player.querySelector('.panda-caption');

 const error=player.querySelector('.panda-error');

 let lastCue=-1;



 function updateCaptions(){

  const cue=clip.hideAnswer||!transcript.hidden?-1:clip.cues.findIndex(([start,end])=>video.currentTime>=start&&video.currentTime<end);

  if(cue===lastCue)return;

  lastCue=cue;

  captions.hidden=cue<0;

  captions.innerHTML=cue<0?'':pandaText(clip.cues[cue]);

 }



 play.onclick=()=>{

  if(!video.paused){video.pause();return}

  if(video.ended)video.currentTime=0;

  video.play().catch(()=>{if(video.error)error.hidden=false});

 };

 video.addEventListener('play',()=>{

  speechNonce++;

  synth?.cancel();

  play.textContent='Ⅱ Пауза';

 });

 const updatePlay=()=>{

  play.hidden=false;

  play.textContent=video.ended?'↻ Ещё раз':video.currentTime?'▶ Продолжить видео':'▶ Послушать Панду';

 };

 video.addEventListener('pause',updatePlay);

 video.addEventListener('ended',updatePlay);

 video.addEventListener('timeupdate',updateCaptions);

 video.addEventListener('error',()=>{error.hidden=false;play.hidden=true});

 if(video.error){error.hidden=false;play.hidden=true;}



 function toggleTranscript(show){

  transcript.hidden=!show;

  textButton.setAttribute('aria-expanded',String(show));

  textButton.textContent=show?'Скрыть текст':clip.hideAnswer?'Показать подсказку':'Читать реплики';

  updateCaptions();

 }

 textButton.onclick=()=>toggleTranscript(transcript.hidden);

 return ()=>toggleTranscript(true);

}



function pandaChoices(prompt, keys){

 return `<div class="panda-choice">

  <h3>${prompt}</h3>

  <div class="panda-options">${shuffle([...keys]).map(k=>`<button class="back" data-panda-answer="${k}">${art(k)}<span class="zh" lang="zh-CN">${PR[k].zh}</span><span class="py">${PR[k].py}</span><span>${PR[k].ru}</span></button>`).join('')}</div>

  <p class="panda-feedback" role="status"></p>

 </div>`;

}



function bindPandaChoices(correct, success, reveal){

 const options=[...app.querySelectorAll('[data-panda-answer]')];

 const feedback=app.querySelector('.panda-feedback');

 options.forEach(button=>button.onclick=()=>{

  pausePandaClip();

  if(button.dataset.pandaAnswer!==correct){

   button.classList.add('panda-try-again');

   feedback.textContent='Попробуй ещё раз. Видео можно переслушать.';

   return;

  }

  options.forEach(option=>{option.disabled=true});

  button.classList.add('panda-correct');

  feedback.textContent=success;

  reveal?.();

  if(correct==='chushi')speak(PR[correct].zh);

 });

}

 if(step===0)bindPandaClip();

 $('#question-audio').onclick=()=>speak(s.zh);$('#answer-audio').onclick=()=>speak(step===1&&p.name!=='Аскар'?'我叫':line);

 if(step===1)$('#player-name').oninput=e=>{p.name=e.target.value;app.querySelector('.speech-card .grammar .zh').textContent=p.name==='Аскар'?'我叫阿斯凯。':'我叫…';app.querySelector('.speech-card .grammar .py').textContent=p.name==='Аскар'?'Wǒ jiào Āsīkǎi.':'Wǒ jiào…'};if(step===2)$('#age').onchange=e=>{p.age=+e.target.value;draw()};if(step===3)$('#country').onchange=e=>{p.country=+e.target.value;draw()};

 $('#hello-next').onclick=()=>{if(step===1&&!p.name.trim()){toast('Впиши своё имя, чтобы Панда познакомился с тобой.');$('#player-name').focus();return}SV.profile=p;save();if(step<3){step++;draw()}else{markDone('hello');sOk();go('cards')}};

 };draw();

}



function memory(){

 const mine=screenSession;const ks=pick(CORE,4);const tiles=shuffle(ks.flatMap(k=>[{k,type:'image'},{k,type:'word'}]));let open=[],matched=new Set(),locked=false,moves=0;

 app.innerHTML=`<section class="screen">${pageTop('Найди пару','Открывай по две карточки: герой и его профессия по-китайски. Всего 4 пары.',sprite(1))}<div class="memory-status" id="memory-status" role="status">Пары: 0 / 4 · Попытки: 0</div><div class="memory-grid">${tiles.map((t,i)=>`<button class="memory-tile" data-tile="${i}" aria-label="Открыть карточку ${i+1}"><span class="card-mark">${icon('ball')}</span><small>АСКАР FC</small></button>`).join('')}</div><div id="memory-end"></div></section>`;

 const buttons=[...app.querySelectorAll('[data-tile]')];

 const show=(i,isOpen)=>{const b=buttons[i],t=tiles[i];b.classList.toggle('open',isOpen);b.innerHTML=isOpen?(t.type==='image'?art(t.k):zp(PR[t.k].zh,PR[t.k].py)):`<span class="card-mark">${icon('ball')}</span><small>АСКАР FC</small>`;b.setAttribute('aria-label',isOpen?PR[t.k].ru:`Открыть карточку ${i+1}`)};

 buttons.forEach((b,i)=>b.onclick=()=>{if(locked||matched.has(i)||open.includes(i)||mine!==screenSession)return;show(i,true);speak(PR[tiles[i].k].zh);open.push(i);if(open.length<2)return;moves++;const [a,c]=open;if(tiles[a].k===tiles[c].k&&tiles[a].type!==tiles[c].type){matched.add(a);matched.add(c);buttons[a].classList.add('matched');buttons[c].classList.add('matched');buttons[a].disabled=buttons[c].disabled=true;open=[];SV.stars++;save();hdr();sOk();if(matched.size===8){markDone('memory');$('#memory-end').innerHTML='<div class="lesson-success"><h2>Все пары найдены!</h2><p>Ты запомнил героев и их профессии. Отличная работа!</p><div class="row" style="justify-content:center"><button class="back" data-go="memory">Ещё раз</button><button class="cta" data-go="family">Теперь про семью →</button></div></div>'}}else{locked=true;setTimeout(()=>{if(mine!==screenSession)return;show(a,false);show(c,false);open=[];locked=false},1400)}$('#memory-status').textContent=`Пары: ${matched.size/2} / 4 · Попытки: ${moves}`});

}



function family(){

 app.innerHTML=`<section class="screen">${pageTop('Кто в твоей семье?','Сначала послушай слова. Потом помоги Панде узнать его семью.',sprite(1,'family'))}<div class="cards">${FAMILY.map((f,i)=>`<button class="wcard" data-family="${i}" aria-label="Послушать: ${f.ru}"><span class="sound-tag">♪</span>${sprite(i,'family',f.ru)}${zp(f.zh,f.py)}<span class="ru">${f.ru}</span></button>`).join('')}</div><div class="panda-activity">${pandaClip('family')}${pandaChoices('Кем работает папа Панды?',['laoshi','yisheng','chushi'])}</div><div class="navigation-lesson"><button class="back" data-go="home">← На главную</button><button class="cta" id="family-start">Поиграть с Пандой →</button></div></section>`;

 app.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>speak(FAMILY[+b.dataset.family].zh));const reveal=bindPandaClip();

 bindPandaChoices('yisheng','Верно, папа Панды — врач · 医生。',reveal);

 $('#family-start').onclick=()=>{pausePandaClip();familyQuiz()};

}

function familyQuiz(){const items=pick(FAMILY,4).map(f=>{const i=FAMILY.indexOf(f);return{ask:'Кого назвала Панда?',say:f.zh,sayPy:f.py,show:false,options:[f,...pick(FAMILY.filter(x=>x!==f),2)].map(x=>({ok:x===f,html:sprite(FAMILY.indexOf(x),'family',x.ru)})),after:{zh:`这是${f.zh}。`,py:`Zhè shì ${f.py}.`,ru:`Это ${f.ru}.`}}});items.push(...pick(CORE,2).map((k,i)=>({ask:`Кем работает ${i?'мама':'папа'} в этой истории?`,say:`我${i?'妈妈':'爸爸'}是${PR[k].zh}。`,sayPy:`Wǒ ${i?'māma':'bàba'} shì ${PR[k].py}.`,show:false,options:[coreOpt(k,true),...distract(k,2,CORE).map(x=>coreOpt(x,false))],after:{zh:`我${i?'妈妈':'爸爸'}是${PR[k].zh}。`,py:`Wǒ ${i?'māma':'bàba'} shì ${PR[k].py}.`,ru:`${i?'Моя мама':'Мой папа'} — ${PR[k].ru}.`}})));quiz({title:'Семья Панды',items,modId:'family',again:familyQuiz})}



function interview(){

 const p=SV.profile||{name:'Аскар',age:7,country:0};const a=Object.assign({members:[],dad:null,mom:null,want:null},SV.interview||{});

 const lines=()=>{const arr=[['大家好！','Dàjiā hǎo!'],[p.name==='Аскар'?'我叫阿斯凯。':`我叫${p.name}。`,p.name==='Аскар'?'Wǒ jiào Āsīkǎi.':'Wǒ jiào…'],[`我${NUMS[p.age][0]}岁。`,`Wǒ ${NUMS[p.age][1]} suì.`]];if(p.country!==5)arr.push([`我来自${COUNTRIES[p.country][0]}。`,`Wǒ láizì ${COUNTRIES[p.country][1]}.`]);a.members.forEach(i=>arr.push([`我有${FAMILY[i].zh}。`,`Wǒ yǒu ${FAMILY[i].py}.`]));if(a.dad)arr.push([`我爸爸是${PR[a.dad].zh}。`,`Wǒ bàba shì ${PR[a.dad].py}.`]);if(a.mom)arr.push([`我妈妈${a.mom===a.dad?'也':''}是${PR[a.mom].zh}。`,`Wǒ māma ${a.mom===a.dad?'yě ':''}shì ${PR[a.mom].py}.`]);if(a.want)arr.push([`我想当${PR[a.want].zh}！`,`Wǒ xiǎng dāng ${PR[a.want].py}!`]);return arr};

 const draw=()=>{

 const existingClip=app.querySelector('[data-panda-clip="interview"]');

 app.innerHTML=`<section class="screen">${pageTop('Ты — звезда команды!','Выбери ответы про себя и расскажи о себе вслух. Можно выбрать только то, о чём хочется говорить.',sprite(5))}<div class="panda-interview">${pandaClip('interview')}</div><div class="profile-grid"><div class="profile-questions"><div class="qrow"><div class="question-label"><button class="sbtn" data-say="你家有谁？" aria-label="Послушать вопрос">🔊</button><div>${zp('你家有谁？','Nǐ jiā yǒu shéi?')}<small>Кто есть в твоей семье? Можно выбрать несколько.</small></div></div><div class="family-choices">${FAMILY.map((f,i)=>`<button class="family-choice ${a.members.includes(i)?'on':''}" data-member="${i}" aria-pressed="${a.members.includes(i)}">${sprite(i,'family')}${zp(f.zh,f.py)}</button>`).join('')}</div></div>${[['dad','爸爸','bàba','папа'],['mom','妈妈','māma','мама']].map(([key,zh,py,ru])=>`<div class="qrow"><div class="question-label"><button class="sbtn" data-say="你${zh}做什么工作？" aria-label="Послушать вопрос">🔊</button><div>${zp(`你${zh}做什么工作？`,`Nǐ ${py} zuò shénme gōngzuò?`)}<small>Кем работает ${ru}? Можно пропустить.</small></div></div><div class="chips">${CORE.map(k=>`<button class="chip ${a[key]===k?'on':''}" data-job="${key}" data-value="${k}" aria-pressed="${a[key]===k}">${zp(PR[k].zh,PR[k].py)}</button>`).join('')}<button class="chip ${!a[key]?'on':''}" data-job="${key}" data-value="">Пропустить</button></div></div>`).join('')}<div class="qrow"><div class="question-label"><button class="sbtn" data-say="你想当什么？" aria-label="Послушать вопрос">🔊</button><div>${zp('你想当什么？','Nǐ xiǎng dāng shénme?')}<small>Кем ты хочешь стать?</small></div></div><div class="chips">${CORE.map(k=>`<button class="chip ${a.want===k?'on':''}" data-job="want" data-value="${k}" aria-pressed="${a.want===k}">${zp(PR[k].zh,PR[k].py)}</button>`).join('')}</div></div></div><aside class="profile-card">${sprite(5)}<h3>В эфире: ${esc(p.name)}!</h3>${lines().map(l=>`<div class="profile-line">${zp(l[0],l[1])}</div>`).join('')}<button class="cta" id="profile-audio">🔊 Послушать рассказ</button><p style="font-size:11px;color:#bed0ad;line-height:1.6;margin:14px 0">Теперь твоя очередь: расскажи всё сам!</p><button class="back" id="profile-done" style="color:#f8f1d9;border-color:#79936d;width:100%">Я рассказал! Финальный матч →</button><button class="back" data-go="hello" style="color:#bed0ad;border:0;width:100%;font-size:10px;margin-top:8px">Изменить имя, возраст или страну</button></aside></div></section>`;

 if(existingClip)app.querySelector('.panda-clip').replaceWith(existingClip);

 else bindPandaClip();

 app.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));const persist=()=>{SV.interview=a;save();const y=window.scrollY;draw();window.scrollTo(0,y)};app.querySelectorAll('[data-member]').forEach(b=>b.onclick=()=>{const i=+b.dataset.member;if(a.members.includes(i))a.members=a.members.filter(x=>x!==i);else{a.members.push(i);speak(FAMILY[i].zh)}persist()});app.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{a[b.dataset.job]=b.dataset.value||null;if(b.dataset.value)speak(PR[b.dataset.value].zh);persist()});$('#profile-audio').onclick=()=>speak(lines().map((l,i)=>i===1&&p.name!=='Аскар'?'我叫。':l[0]).join('')+'谢谢！');$('#profile-done').onclick=()=>{markDone('interview');go('final')};};draw();

}

function final(){quiz({title:'Финальный матч',items:shuffle([...coreItems(false,3),...coreItems(true,3)]),penalty:true,modId:'final',again:final})}



function result(r){

 const messages={club:['Команда собрана!','Теперь потренируем слух.','pass'],pass:['Отличный пас!','Хочешь проверить память?','memory'],family:['Панда познакомилась с семьёй!','Теперь расскажи о себе.','interview'],final:['Ты — чемпион команды!','Ты выучил профессии и поиграл по-китайски.','interview']};const [title,desc,next]=messages[r.modId]||['Отличная тренировка!','Ты справился со всеми заданиями.','home'];

 app.innerHTML=`<section class="screen"><div class="final">${sprite(r.modId==='family'?1:4,r.modId==='family'?'family':'prof')}<div class="eyebrow" style="justify-content:center;margin-top:15px">ТРЕНИРОВКА ПРОЙДЕНА</div><h1>${title}</h1><p class="sub" style="margin:12px auto 18px">${desc}</p><div class="big">${r.a} / ${r.n}</div><p style="font-size:12px;color:var(--muted)">с первой попытки · Все ${r.n} заданий решены!</p><div class="row" style="justify-content:center;margin-top:22px"><button class="back" id="again">Ещё раз</button><button class="cta" data-go="${next}">${r.modId==='final'?'Моё интервью':r.modId==='family'?'Рассказать о себе':'Следующая игра'} →</button><button class="back" data-go="home">На главную</button></div>${r.miss.length?`<details class="teacher"><summary>Для учителя: что повторить (${r.miss.length})</summary><ul style="margin-top:12px">${r.miss.map(m=>`<li>${esc(m.q)}${m.ans?' → '+esc(m.ans):''}<small>Первый ответ: ${esc(m.picked)}</small></li>`).join('')}</ul></details>`:'<p class="success-check" style="margin-top:25px">Все ответы с первого раза. Здорово!</p>'}</div></section>`;$('#again').onclick=r.again;sStick();

}



function teacher(){

 const returnFocus=document.activeElement;ovEl.innerHTML=`<div class="ov" id="teacher-overlay"><section class="teacher-modal" role="dialog" aria-modal="true" aria-labelledby="teacher-title" tabindex="-1"><div class="modal-head"><h2 id="teacher-title">Урок с маленьким чемпионом</h2><button id="close-teacher" aria-label="Закрыть">×</button></div><p>Основной маршрут на 20–25 минут. Одна игра — один навык. Если ребёнок устал, закончите после любого раунда.</p>${[['01','Знакомство','Приветствие, имя, возраст, страна','3 мин'],['02','Новые слова + игры','6 профессий → ситуация → слух → пары','8 мин'],['03','Семья','6 слов о семье + профессии родителей','5 мин'],['04','Интервью и матч','Личный рассказ + 6 пенальти','6 мин']].map(([n,t,d,m])=>`<div class="plan-row"><span>${n}</span><div><b>${t}</b><small>${d}</small></div><small>${m}</small></div>`).join('')}<div class="teacher-note">Слушайте, показывайте, повторяйте. На устные ответы ребёнок отвечает сам, а взрослый помогает. Приложение не оценивает произношение. Профессии родных в интервью можно пропустить.</div><h3 style="font-size:15px;margin-top:22px">Материалы из исходного сайта</h3><p>Для следующих занятий: расширенный словарь, альбом и семьи футболистов. В Кубке звёзд можно открыть портрет и послушать две короткие фразы.</p><div class="teacher-links"><button class="back" data-go="extended">14 профессий</button><button class="back" data-go="album">Кубок звёзд</button><button class="back" data-go="guess">Угадай звезду</button><button class="back" data-go="legacyFamily">Семьи звёзд</button></div><h3 style="font-size:15px;margin:22px 0 8px">Озвучка</h3><p id="voice-status">${esc(voiceSummary())}</p><div class="teacher-links"><button class="back" id="teacher-voice">Выбрать голос</button><button class="back" id="teacher-slow">${slow?'Обычная скорость':'Медленнее'}</button></div><div class="teacher-links" style="margin-top:24px"><button class="back" id="reset-progress">Сбросить игровой прогресс</button></div></section></div>`;

 const close=()=>{ovEl.innerHTML='';returnFocus?.focus()};$('#close-teacher').onclick=close;$('#teacher-overlay').onclick=e=>{if(e.target.id==='teacher-overlay')close()};$('#teacher-voice').onclick=voicePicker;$('#teacher-slow').onclick=()=>setSlowVoice(!slow);let armed=false;$('#reset-progress').onclick=e=>{if(!armed){armed=true;e.currentTarget.textContent='Подтвердить сброс прогресса';return}const profile=SV.profile;SV={stars:0,glued:{},best:{},profile};save();hdr();close();go('home')};const dialog=$('.teacher-modal');dialog.focus();dialog.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){const bs=[...dialog.querySelectorAll('button,a,input,select,[tabindex="0"]')];const f=bs[0],l=bs[bs.length-1];if(e.shiftKey&&(document.activeElement===f||document.activeElement===dialog)){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}};

}



const MODS={hello:{fn:hello},cards:{fn:cards},club:{fn:club},pass:{fn:pass},memory:{fn:memory},family:{fn:family},interview:{fn:interview},final:{fn:final},album:{fn:album},guess:{fn:guess},legacyFamily:{fn:legacyFamily},extended:{fn:legacyCards}};

$('#teacher-open').onclick=teacher;



$('#home').onclick=home;

$('#tPy').onclick=e=>{const on=document.body.classList.toggle('nopy');e.currentTarget.setAttribute('aria-pressed',String(!on))};

$('#tSlow').onclick=()=>setSlowVoice(!slow);

$('#tKid').onclick=e=>{kid=!kid;e.currentTarget.setAttribute('aria-pressed',String(kid));pickVoice();speak('你好！我是熊猫！')};

$('#tVoice').onclick=voicePicker;

document.querySelectorAll('[data-icon]').forEach(x=>x.innerHTML=icon(x.dataset.icon));

const starHashes=['#stars','#album','#cup'];hdr();go(starHashes.includes(location.hash)?'album':'home');window.addEventListener('hashchange',()=>go(starHashes.includes(location.hash)?'album':'home'));

})();

</script>
